<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#1c2127; --paper:#fbfbf9; --rule:#d8d6cf; --muted:#6b7280;
    --accent:#2c5f7c; --quiet:#f2f1ec;
  }
  html { background: var(--paper); color-scheme: light only; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); padding:0 20px;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap{max-width:860px; margin:0 auto; padding:34px 0 80px;}
  .kicker{font:600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent);}
  h1{font-size:24px; font-weight:700; letter-spacing:-.01em; margin:8px 0 2px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:26px;}
  .tnote{background:var(--quiet); border:1px solid var(--rule); border-radius:6px;
    padding:10px 14px; font-size:13.5px; color:var(--muted); margin-bottom:22px;}
  .tnote a{color:var(--accent);}
  .turn{display:grid; grid-template-columns:74px 1fr; gap:14px; padding:12px 0;
    border-bottom:1px solid var(--rule);}
  .turn:last-of-type{border-bottom:none;}
  .who{font:700 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.1em;
    text-transform:uppercase;}
  .turn.u .who{color:var(--ink);}
  .turn.c .who{color:var(--accent);}
  .msg{font-size:15px; min-width:0;}
  .turn.c .msg{color:#3a4149;}
  .msg > :first-child{margin-top:0;}
  .msg p{margin:8px 0;}
  .msg ul,.msg ol{margin:8px 0 8px 22px;}
  .msg li{margin:4px 0;}
  .msg h1,.msg h2,.msg h3,.msg h4{font-size:15.5px; margin:14px 0 6px;}
  .msg pre{background:var(--quiet); border:1px solid var(--rule); border-radius:6px;
    padding:9px 12px; overflow-x:auto; font-size:12.5px;}
  .msg code{font-size:.88em;}
  .msg table{border-collapse:collapse; font-size:13.5px; display:block; overflow-x:auto;}
  .msg th,.msg td{border:1px solid var(--rule); padding:4px 9px; text-align:left;}
  .msg blockquote{border-left:3px solid var(--rule); margin:8px 0; padding:2px 14px; color:var(--muted);}
  .msg .act{color:var(--muted); font-style:italic; font-size:13px;}
  @media (max-width:560px){ .turn{grid-template-columns:1fr; gap:2px;} }
</style>

<div class="wrap">
  <div class="kicker">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{SUBTITLE}}</div>

  <p class="tnote">{{NOTE}}</p>

{{TURNS}}

</div>
